name: CI

on:
  push:
    branches: [main, "etapa-**"]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aa
          POSTGRES_PASSWORD: aa_prueba
          POSTGRES_DB: aa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Base de datos de prueba efímera de la CI; datos ficticios.
      TEST_DATABASE_URL: postgres://aa:aa_prueba@localhost:5432/aa_test
      LOG_ERROR_DETAIL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Tipos (interfaz y servidor)
        run: npm run typecheck
      - name: Pruebas unitarias y de integración (incluye PostgreSQL + Better Auth reales)
        run: npm test
      - name: Compilar con Vite y servidor
        run: npm run build
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Prueba de extremo a extremo
        run: npm run test:e2e
        env:
          SHOTS_DIR: e2e-capturas
      - name: Micrófono en Chromium con proveedor local
        run: npm run test:e2e:voz
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-e2e
          path: e2e-capturas
          if-no-files-found: ignore
